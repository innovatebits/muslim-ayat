name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Build
        run: bun run build

  rls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.108.0

      - name: Start local Supabase
        run: supabase start

      - name: Validate database migrations
        run: supabase db lint --schema public

      - name: Run Row Level Security tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, rls]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenNext Worker
        run: bun run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FEATURE_TRANSLATIONS: ${{ vars.NEXT_PUBLIC_FEATURE_TRANSLATIONS }}
          NEXT_PUBLIC_FEATURE_MUSHAF_LAYOUT: ${{ vars.NEXT_PUBLIC_FEATURE_MUSHAF_LAYOUT }}
          NEXT_PUBLIC_FEATURE_SURAH_HEADERS: ${{ vars.NEXT_PUBLIC_FEATURE_SURAH_HEADERS }}
          NEXT_PUBLIC_FEATURE_TRANSLITERATION: ${{ vars.NEXT_PUBLIC_FEATURE_TRANSLITERATION }}
          NEXT_PUBLIC_FEATURE_TAFSIR: ${{ vars.NEXT_PUBLIC_FEATURE_TAFSIR }}
          NEXT_PUBLIC_FEATURE_WORD_BY_WORD: ${{ vars.NEXT_PUBLIC_FEATURE_WORD_BY_WORD }}
          NEXT_PUBLIC_FEATURE_SEARCH: ${{ vars.NEXT_PUBLIC_FEATURE_SEARCH }}
          NEXT_PUBLIC_FEATURE_AUDIO: ${{ vars.NEXT_PUBLIC_FEATURE_AUDIO }}
          NEXT_PUBLIC_FEATURE_OFFLINE: ${{ vars.NEXT_PUBLIC_FEATURE_OFFLINE }}
          NEXT_PUBLIC_FEATURE_BOOKMARKS: ${{ vars.NEXT_PUBLIC_FEATURE_BOOKMARKS }}
          NEXT_PUBLIC_FEATURE_NOTES: ${{ vars.NEXT_PUBLIC_FEATURE_NOTES }}
          NEXT_PUBLIC_FEATURE_READING_PROGRESS: ${{ vars.NEXT_PUBLIC_FEATURE_READING_PROGRESS }}
          NEXT_PUBLIC_FEATURE_READER_PREFERENCES: ${{ vars.NEXT_PUBLIC_FEATURE_READER_PREFERENCES }}
          NEXT_PUBLIC_FEATURE_ACCOUNT_PROFILE: ${{ vars.NEXT_PUBLIC_FEATURE_ACCOUNT_PROFILE }}
          NEXT_PUBLIC_FEATURE_AUTH_EMAIL_PASSWORD: ${{ vars.NEXT_PUBLIC_FEATURE_AUTH_EMAIL_PASSWORD }}
          NEXT_PUBLIC_FEATURE_AUTH_PASSWORD_RESET: ${{ vars.NEXT_PUBLIC_FEATURE_AUTH_PASSWORD_RESET }}
          NEXT_PUBLIC_FEATURE_AUTH_EMAIL_OTP: ${{ vars.NEXT_PUBLIC_FEATURE_AUTH_EMAIL_OTP }}
          NEXT_PUBLIC_FEATURE_AUTH_MAGIC_LINK: ${{ vars.NEXT_PUBLIC_FEATURE_AUTH_MAGIC_LINK }}
          NEXT_PUBLIC_FEATURE_AUTH_GOOGLE: ${{ vars.NEXT_PUBLIC_FEATURE_AUTH_GOOGLE }}
          NEXT_PUBLIC_FEATURE_AUTH_MICROSOFT: ${{ vars.NEXT_PUBLIC_FEATURE_AUTH_MICROSOFT }}
          NEXT_PUBLIC_FEATURE_AUTH_FACEBOOK: ${{ vars.NEXT_PUBLIC_FEATURE_AUTH_FACEBOOK }}

      - name: Deploy to Cloudflare Workers
        run: bun run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}